cl_drawhud 1
cl_draw_only_deathnotices 0
cl_radar_always_centered 0
cl_radar_scale 0.7
spec_show_xray 0
// Voice stays fully ON (CSDM --player-voices + explicit voice_enable 1).
// No cl_mute_* here: cl_mute_enemy_team muted all voice in PBDEMS2 playback.
snd_mute_losefocus 0

// Voice: listen to ALL players (tv_listen_voice_indices -1 = every player)
// + voice_enable on, so talking indicators + voice are processed.
voice_enable 1
tv_listen_voice_indices -1
tv_listen_voice_indices_h -1
tv_relaytextchat 2

// Unlimited FPS while rendering — run as fast as the GPU allows instead of
// capping, so demo renders finish faster (the window is parked behind, not minimized).
fps_max 0

// Chat filters — bitmask, set bit = hide that category.
// All=1, CT=2, T=4, Spec=8 (player chat), Console=16, Error=32 (server/system).
// 48 = hide server/system messages (16+32), keep player chat.
cl_chatfilters 48

// Force first person perspective (prevents third person/spectator switch)
cl_spec_mode 5

// Reset crosshair to clean state — config.cfg may have teaching/util crosshair from prior renders
crosshair 1
cl_show_observer_crosshair 0
cl_crosshairstyle 2
cl_crosshaircolor 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 50
cl_crosshairsize 3
cl_crosshairthickness 0.5
cl_crosshairgap 0
cl_crosshairdot 0
cl_crosshair_drawoutline 1
cl_crosshair_outlinethickness 1

// Restore user keybinds after csdm resets them (may reset render cvars — re-apply below)
exec autoexec
crosshair 1
cl_show_observer_crosshair 0
cl_crosshairstyle 2
cl_crosshaircolor 0
cl_crosshaircolor_r 50
cl_crosshaircolor_g 250
cl_crosshaircolor_b 50
cl_crosshairsize 3
cl_crosshairthickness 0.5
cl_crosshairgap 0
cl_crosshairdot 0
cl_crosshair_drawoutline 1
cl_crosshair_outlinethickness 1

// NOTE: player crosshair is injected BELOW (in render_crosshair.cfg) so it overrides all above
exec render_crosshair

// Mute music to prevent copyright claims (re-mute after exec autoexec)
snd_mvp_volume 0
snd_mute_mvp_music_live_players 1
snd_musicvolume 0
snd_roundend_volume 0
snd_roundstart_volume 0
snd_menumusic_volume 0
