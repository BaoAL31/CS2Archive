cl_drawhud 1
cl_draw_only_deathnotices 0
cl_radar_always_centered 0
cl_radar_scale 0.7
spec_show_xray 0
// Voice stays fully ON (CSDM --player-voices + explicit voice_enable 1).
// No cl_mute_* here: cl_mute_enemy_team muted all voice in PBDEMS2 playback.
snd_mute_losefocus 0

// Voice: listen to ALL players (tv_listen_voice_indices -1 = every player)
// These enable audio; Swift DemoUI Pro supplies demo speaker indicators.
voice_enable 1
voice_modenable 1
tv_listen_voice_indices -1
tv_listen_voice_indices_h -1

// Unlimited FPS while rendering — run as fast as the GPU allows instead of
// capping, so demo renders finish faster (the window is parked behind, not minimized).
fps_max 0

// Chat / console text — keep in sync with cs2archive/chat_hide.py (the render
// autoexec writes the same set). cl_chatfilters and tv_relaytextchat DO NOT
// exist in CS2; cl_showtextmsg is what kills the relayed "Console: ..." lines.
// sv_cheats 1 comes FIRST: hidehud/screenmessage_show are cheat-protected and
// silently ignored with cheats off; the flag flips on the local demo server
// so the cheat-gated lines below actually apply. The mirv_cvar_hack lines
// force-apply the two display kills via HLAE bypassing cheat protection
// entirely (sequence cfgs run with the hook engaged).
// VERDICT 2026-10-07: frame-proven across five renders that none of this
// hides the Panorama chat panel in CSDM demo playback (hidehud 1023 = every
// low bit left the full HUD drawn). Per explicit user decision there is no
// pixel cover-up: cfg suppression or nothing. Kept as full best-effort.
sv_cheats 1
mirv_cvar_hack hidehud 128
mirv_cvar_hack screenmessage_show 0
cl_showtextmsg 0
hidehud 128
tv_nochat 1
tv_show_allchat 0
// Radio/voice lines are CLOSE CAPTIONS (cl_showtextmsg does not touch them).
closecaption 0
cc_subtitles 0
tv_relayradio 0
sv_ignoregrenaderadio 1
// On-screen console/chat text is a THIRD subsystem (bottom-left `Console:`
// + `[ALL]` lines share one display list): screenmessage_show defaults to
// -1 (enabled when vgui is absent = the render case) and is cheat-gated —
// settable here because sv_cheats 1 runs first above. The bare
// screenmessage_notifytime is the server timer, so the CLIENT timer
// cl_screenmessage_notifytime rides along as backup (0s display even if a
// print lands before this cfg executes).
screenmessage_show 0
cl_screenmessage_notifytime 0

// Force first person perspective (prevents third person/spectator switch)
cl_spec_mode 5

// Crosshair: draw on, observer off. Player Length/gap/color are NOT set here —
// render_pov inlines them at the end of each sequence cfg (same as render_hook).
// Nested `exec render_crosshair` was unreliable under CSDM; teaching defaults
// (size 3) used to win and inflate arms.
crosshair 1
cl_show_observer_crosshair 0

// Flash suppressor: Valve's r_spectator_flashbang_opacity (0 = minimal,
// 1 = full blind). Spec-locked POV renders ignore HLAE's mirv_noflash
// entirely here (measured 2026-10-07: mirv_noflash 0 / 0.5 / 1 all render
// identical full white, flash-window luma ~223 peak ~226) — the white-out
// comes through the spectator path, independent of HLAE noflash.
// 0.8 takes the edge off (flash luma ~211 peak ~217) while still reading
// as a real flash; 0.5 is the true half-flash (luma ~169 peak ~182,
// decaying as the blind wears off). This file is the base for every
// sequence cfg (POV, hook, shorts, highlights).
r_spectator_flashbang_opacity 0.8

// Restore user keybinds after csdm resets them.
exec autoexec

// Mute music to prevent copyright claims (re-mute after exec autoexec)
snd_mvp_volume 0
snd_mute_mvp_music_live_players 1
snd_musicvolume 0
snd_roundend_volume 0
snd_roundstart_volume 0
snd_menumusic_volume 0

// Per-sequence HLAE spec lock (written by render_pov._write_spec_lock_cfg).
exec spec_lock
