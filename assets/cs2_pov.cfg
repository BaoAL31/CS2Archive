cl_drawhud 1
cl_draw_only_deathnotices 0
cl_radar_always_centered 0
cl_radar_scale 0.7
spec_show_xray 0
// Voice stays fully ON (CSDM --player-voices + explicit voice_enable 1).
// No cl_mute_* here: cl_mute_enemy_team muted all voice in PBDEMS2 playback.
snd_mute_losefocus 0

// Voice: listen to ALL players (tv_listen_voice_indices -1 = every player)
// These enable audio; Swift DemoUI Pro supplies demo speaker indicators.
voice_enable 1
voice_modenable 1
tv_listen_voice_indices -1
tv_listen_voice_indices_h -1
tv_relaytextchat 2

// Unlimited FPS while rendering — run as fast as the GPU allows instead of
// capping, so demo renders finish faster (the window is parked behind, not minimized).
fps_max 0

// Chat filters — bitmask, set bit = hide that category.
// All=1, CT=2, T=4, Spec=8 (player chat), Console=16, Error=32 (server/system).
// 63 = hide ALL chat — cl_chatfilters is unreliable for demo/GOTV relayed
// admin/system lines (48 didn't catch them), so kill the chat box entirely.
// HUD/banners untouched.
cl_chatfilters 63

// Force first person perspective (prevents third person/spectator switch)
cl_spec_mode 5

// Crosshair: draw on, observer off. Player Length/gap/color are NOT set here —
// render_pov inlines them at the end of each sequence cfg (same as render_hook).
// Nested `exec render_crosshair` was unreliable under CSDM; teaching defaults
// (size 3) used to win and inflate arms.
crosshair 1
cl_show_observer_crosshair 0

// Restore user keybinds after csdm resets them.
exec autoexec

// Mute music to prevent copyright claims (re-mute after exec autoexec)
snd_mvp_volume 0
snd_mute_mvp_music_live_players 1
snd_musicvolume 0
snd_roundend_volume 0
snd_roundstart_volume 0
snd_menumusic_volume 0

// Per-sequence HLAE spec lock (written by render_pov._write_spec_lock_cfg).
exec spec_lock
