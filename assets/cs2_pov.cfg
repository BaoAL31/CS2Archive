cl_drawhud 1
cl_draw_only_deathnotices 0
cl_radar_always_centered 0
cl_radar_scale 0.7
spec_show_xray 0
cl_mute_enemy_team 1
cl_mute_all_but_friends_and_party 1

// Hide all chat messages (bitmask: All=1, CT=2, T=4, Spec=8, Console=16, Error=32)
cl_chatfilters 63

// Disable MVP music to prevent copyright claims
snd_mvp_music 0
cl_mute_mvp_music 1

// Restore user keybinds after csdm resets them
exec autoexec
