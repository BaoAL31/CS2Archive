cl_drawhud 1
cl_draw_only_deathnotices 0
cl_radar_always_centered 0
cl_radar_scale 0.7
spec_show_xray 0
cl_mute_enemy_team 1
cl_mute_all_but_friends_and_party 1

// Hide all chat messages (bitmask: All=1, CT=2, T=4, Spec=8, Console=16, Error=32)
cl_chatfilters 63

// Force first person perspective (prevents third person/spectator switch)
cl_spec_mode 5

// Restore user keybinds after csdm resets them (may reset audio — re-mute below)
exec autoexec

// Mute music to prevent copyright claims (must run AFTER exec autoexec)
snd_mvp_volume 0
snd_mute_mvp_music_live_players 1
snd_musicvolume 0
snd_roundend_volume 0
snd_roundstart_volume 0
snd_menumusic_volume 0
