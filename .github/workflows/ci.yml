name: CI

# CR-13: the gate is ruff (crash-level rules) + a waiver audit that fails on an untokened or
# expired suppression. A third job runs the test suite as a delta check against
# tests/known_failures.txt.
#
# WHY THE TEST JOB IS `continue-on-error` ON HOSTED RUNNERS:
#   The suite needs .data/ and .cache/ (both gitignored) and a very heavy dependency set
#   (pandas, numpy, demoparser2, moviepy, cloakbrowser, playwright, the sibling CS2UtilArchive
#   checkout). A hosted runner cannot reproduce that state, so its failure set is not comparable
#   to the baseline and a blocking gate there would be noise, not signal. The council's decision
#   (b-scoped) is therefore enforced where the environment exists:
#     * locally / on a self-hosted runner:   python .github/scripts/check_known_failures.py
#   and the hosted job still runs the suite and reports the delta so drift is visible.
#   Set CS2ARCHIVE_ENFORCE_TESTS=1 (self-hosted, with the env present) to make it blocking.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: ruff (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Version is pinned to the one the waivers were measured against; bump deliberately.
      - run: uvx ruff@0.16.9 check .
      # CR-09 ratchet: S110/BLE001 debt may only shrink. Advisory in spirit, blocking in practice:
      # it fails only when the count exceeds the recorded ceiling.
      - run: python .github/scripts/report_silent_excepts.py

  waivers:
    name: waiver audit (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/check_waivers.py

  tests:
    name: pytest delta vs known_failures
    runs-on: ${{ vars.CS2ARCHIVE_RUNNER || 'ubuntu-latest' }}
    continue-on-error: ${{ vars.CS2ARCHIVE_ENFORCE_TESTS != '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        # Deliberately NOT `|| true`: a failed install is the signal that the suite cannot run here,
        # and the job's continue-on-error keeps the build green while still showing the reason.
        run: python -m pip install -r requirements.txt pytest
      - name: Run the delta check
        # Self-hosted enforcement (make this job blocking):
        #   set repository variable CS2ARCHIVE_ENFORCE_TESTS=1 and CS2ARCHIVE_RUNNER=<self-hosted
        #   label>, with the conda env, .data/ and .cache/ present. See the "Lint and CI" section
        #   of AGENTS.md.
        run: python .github/scripts/check_known_failures.py
